<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>VulnWeb Lab</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 16px; }
    code, pre { background: #f4f4f4; padding: 2px 6px; border-radius: 6px; }
    pre { padding: 12px; overflow:auto; }
    nav a { margin-right: 12px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
    .muted { color: #666; font-size: 0.95em; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/search">Search</a>
    <a href="/notes">Notes</a>
    <a href="/tools/ping">Ping Tool</a>
    {% if viewer %}
      <span style="float:right;">Logged in as <b>{{ viewer }}</b> | <a href="/logout">Logout</a></span>
    {% else %}
      <span style="float:right;"><a href="/login">Login</a></span>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
